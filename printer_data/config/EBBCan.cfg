#MCU Reference and ID
[mcu EBBCan]
canbus_uuid: a557da4ed9cc

#Temperature of the MCU Chip
[temperature_sensor Toolhead_MCU]
sensor_type: Generic 3950
sensor_pin: EBBCan: PA2
#Accelorometer
[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: z,-y,x

[resonance_tester]
probe_points: 100, 100, 20
accel_chip: adxl345

#Extruder
[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 4.534
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250
min_extrude_temp: 0 #TESTING

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.350
stealthchop_threshold: 0

[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0

# Part cooling fan
[fan]
pin: EBBCan: PA1

#Logo RGB
[neopixel hotend_rgb]
pin: EBBCan:PD3

#Mechanical switches

#X endstop
[stepper_x]
endstop_pin: EBBCan: PB6

#Z probe (clicky)
[stepper_z]
endstop_pin: EBBCan: PB8

#Filament Sensor before extruder
[filament_switch_sensor Pre_Ext]
pause_on_runout: True
switch_pin: EBBCan: PB5
runout_gcode:
    M118 Filament runout detected
insert_gcode:
    M118 Filament restored


#Filament Sensor after eftruder
[filament_switch_sensor Post_Ext]
pause_on_runout: True
switch_pin: EBBCan: PB7
runout_gcode:
    M118 No filament in HOTEND
insert_gcode:
    M118 Filament in HOTEND
